name: Build desktop app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the whole game as one html file: double-click to play, nothing to install
  single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-html.js dist/The-Night-Shelver.html
      - uses: actions/upload-artifact@v4
        with:
          name: NightShelver-SingleFile
          path: dist/The-Night-Shelver.html
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: NightShelver-Windows
            files: |
              dist/*.zip
              dist/*.exe
          - os: ubuntu-latest
            name: NightShelver-Linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log
          # the app must ship with its own icon, never Electron's default one
          if grep -qi "default Electron icon is used" build.log; then echo "::error::The app icon was not applied"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
