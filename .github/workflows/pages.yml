name: Publish web version

# Publishes the game (everything under src/) as a website on GitHub Pages,
# so it can be played in a browser from a link with nothing to download.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'tools/build-html.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the whole game as one file, offered as a download on the title screen
      - name: Build the single-file version
        run: node tools/build-html.js src/The-Night-Shelver.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
