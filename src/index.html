<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Tidy Hollow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="btn icon-btn" data-act="pause" title="Pause"><span data-icon="pause"></span></button>
    <div class="hud-title">
      <div id="hud-name"></div>
      <div id="hud-hint"></div>
    </div>
    <div class="hud-progress">
      <div class="bar"><div id="hud-bar"></div></div>
      <div id="hud-count"></div>
    </div>
    <div id="hud-fx"></div>
    <div class="chip" id="hud-combo"><b>0</b><span>streak</span></div>
    <div class="chip coin"><span data-icon="coin"></span><b id="hud-coins">0</b></div>
  </div>
  <div class="hud-bottom">
    <div id="hud-abil"></div>
    <button class="btn small ghost" data-act="shuffle" id="hud-shuffle"></button>
  </div>
</div>

<div id="screens"></div>
<div id="modal" class="hidden"></div>
<div id="tip" class="hidden"></div>
<div id="toasts"></div>
<div id="fps" class="hidden"></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/draw.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
