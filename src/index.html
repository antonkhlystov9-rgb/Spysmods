<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>The Night Shelver</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b3a66">
<meta name="description" content="A cozy first-person library organizing game. Shelve 1,152 books and read every one.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="btn icon-btn touch-only" data-act="pause" title="Pause" aria-label="Pause">II</button>
    <button class="btn small touch-only" data-act="read">Read</button>
    <button class="btn small touch-only" data-act="drop">Drop</button>
    <div class="hud-title">
      <div id="hud-name"></div>
      <div id="hud-hint"></div>
    </div>
    <div class="hud-progress">
      <div class="bar"><div id="hud-bar"></div></div>
      <div id="hud-count"></div>
    </div>
    <div id="hud-fx"></div>
    <div class="chip" id="hud-combo"><b>0</b><span>streak</span></div>
    <div class="chip coin"><span data-icon="coin"></span><b id="hud-coins">0</b></div>
  </div>
  <div id="cross"></div>
  <div id="target" class="hidden"><b></b><span></span></div>
  <div id="flash" class="hidden"></div>
  <div id="banner" class="hidden"><b></b><span></span></div>
  <div id="lockhint" class="hidden">Click to look around</div>
  <div id="held"></div>
  <div class="hud-bottom"><div id="hud-abil"></div></div>
</div>

<div id="screens"></div>
<div id="modal" class="hidden"></div>
<div id="tip" class="hidden"></div>
<div id="toasts"></div>
<div id="fps" class="hidden"></div>

<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/stories.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
